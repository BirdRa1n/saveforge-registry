name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Fetch pinned upstream manifest
        run: npm run fetch-upstream

      - name: Build distribution (test keys)
        run: npm run build -- --keys test

      - name: Build is deterministic
        run: |
          mv dist dist-first
          npm run build -- --keys test
          diff -r dist-first dist

      - uses: actions/upload-artifact@v4
        with:
          name: registry-dist
          path: dist/

      - name: Package for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Serves dist/ at https://<owner>.github.io/savevault-registry/, so clients
  # use .../savevault-registry/v1/ as a mirror. Signed with the PUBLIC test
  # keys until production keys exist: development builds only.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
